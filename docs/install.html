<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ecdf" />
    <title>把英文放到手機</title>
    <style>
      body { margin: 0; background: #f3ecdf; color: #2a2118; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
      .wrap { max-width: 430px; margin: 0 auto; padding: 24px 16px 40px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      .lead, .step p, .note { line-height: 1.5; }
      .lead { margin: 0 0 20px; }
      .step { background: #fffdf9; border-radius: 18px; padding: 14px; margin: 10px 0; box-shadow: 0 10px 28px rgba(52, 38, 31, 0.08); }
      .step strong { display: block; margin-bottom: 6px; }
      .step p { margin: 0; }
      a.go { display: grid; place-items: center; margin-top: 16px; min-height: 48px; border-radius: 14px; background: #2c211b; color: #f6f0e6; text-decoration: none; font-weight: 760; }
      .note { margin-top: 16px; color: #5e564c; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>放到手機</h1>
      <p class="lead">跟記帳簿一樣，打開網頁就能用。進度只留在這台裝置，不用安裝 Git。</p>
      <section class="step">
        <strong>iPhone</strong>
        <p>用 Safari 打開這個網站。點分享，選「加入主畫面」。若看到「作為網頁 App 開啟」，把它打開再按加入。</p>
      </section>
      <section class="step">
        <strong>Android</strong>
        <p>用 Chrome 打開。點選單，選「加到主畫面」或「安裝應用程式」。</p>
      </section>
      <section class="step">
        <strong>之後</strong>
        <p>從主畫面的「英文」進入。第一次要有網路，存好之後沒有網路也能輪播。</p>
      </section>
      <a class="go" href="./">回到英文</a>
      <p class="note">發音用手機自己的英文語音。若念起來不像英文，到系統設定加入英文語音。</p>
    </main>
  </body>
</html>
